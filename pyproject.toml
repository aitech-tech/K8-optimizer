[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k8optimizer"
version = "0.1.0"
description = "Autonomous Kubernetes cost optimization with zero downtime (ScaleOps-style)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["k8optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"